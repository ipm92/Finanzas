function xhr(method, url, body) {
  return new Promise((resolve, reject) => {
    const r = new XMLHttpRequest();
    r.open(method, url, true);
    r.setRequestHeader("Content-Type", "application/json");
    r.setRequestHeader("apikey", SUPABASE_KEY);
    r.setRequestHeader("Authorization", "Bearer " + SUPABASE_KEY);
    r.setRequestHeader("Prefer", "return=representation");
    r.timeout = 12000;
    r.ontimeout = () => reject(new Error("Timeout - sin conexión"));
    r.onerror   = () => reject(new Error("Error de red"));
    r.onload    = () => {
      if (r.status >= 200 && r.status < 300) {
        try { resolve(JSON.parse(r.responseText)); } catch(e) { resolve([]); }
      } else {
        reject(new Error("Error " + r.status + ": " + r.responseText));
      }
    };
    r.send(body ? JSON.stringify(body) : null);
  });
}

function autoCategoria(desc) {
  if (!desc) return "";

  for (const [keys, cat] of AUTOCAT) {

function diasRestantes(fecha) {
  if (!fecha || fecha === 'null' || fecha === '') return null;

  const hoyMs = new Date().setHours(0,0,0,0);
  const fMs   = d.setHours(0,0,0,0);

}

        return `<div style="background:#fff;border-radius:${rad};padding:12px 16px;display:flex;align-items:center;gap:12px;opacity:.5;">

            <p style="font-size:14px;font-weight:500;color:#888;text-decoration:line-through;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(r.descripcion)}</p>
          </div>

          <button onclick="accionEliminarRec(${r.id})" style="font-size:16px;color:#ddd;">×</button>
        </div>`;
      }).join("")}
    </div>`:""}
  </div>`;
}

const CUENTA_LABELS = {
  "davi-td": "Cta ahorros Davivienda",
  "davi-tc": "Davi TC",
  "rappi-tc": "Rappi TC",
  "nequi": "Nequi",
  "nubank": "NuBank",
  "daviplata": "Daviplata",
  "efectivo": "Efectivo",
  "fic": "FIC 1 Corredores",
  "splitwise": "Splitwise",
  "otro": ""
};
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

function splitDivisor(tipo) {
  const t = (tipo||"").toLowerCase();
  if (t.includes("cuartos") && t.includes("coshitas")) return 8;
  if (t.includes("cuartos")) return 4;
  if (t.includes("mitades")) return 2;
  if (t.includes("coshitas")) return 2;
  return 1; // unknown type: export as-is
}

function miParteSplit(r) {
  // If montoTotalSplit is set, use it; otherwise monto is the total
  const total = r.montoTotalSplit || r.monto;
  const div = splitDivisor(r.splitwiseTipo);
  return Math.round(total / div);
}

function cuentaLabel(r) {
  if (r.splitwise) {
    const t = (r.splitwiseTipo || "").toLowerCase();
    if (t.includes("familia")) return "Splitwise Familia";
    return "Splitwise Coshitas";
  }
  if (r.cuenta === "otro" && r.cuentaOtro) {
    const co = r.cuentaOtro.trim();
    if (co === "Pibank") return "Pibank";
    if (co === "RappiCuenta") return "RappiCuenta";
    if (co === "Bolsillo Rappipay") return "Bolsillo Rappipay";
    return co;
  }
  return CUENTA_LABELS[r.cuenta] || r.cuenta || "";
}

function notaExport(r) {
  let nota = r.nota || "";
  if (r.splitwise) {
    const t = (r.splitwiseTipo || "").toLowerCase();
    const etiq = t.includes("familia") ? "Splitwise Familia" : "Splitwise Coshitas";
    const div = splitDivisor(r.splitwiseTipo);
    const total = r.montoTotalSplit || r.monto;
    const detalle = `${etiq} (${total.toLocaleString("es-CO")} ÷ ${div})`;
    nota = nota ? detalle + " — " + nota : detalle;
  }
  return nota;
}

function fechaCorta(f) {
  if (!f) return "";
  const [y,m,d] = f.split("-");
  return parseInt(d) + "-" + MESES[parseInt(m)-1];
}

// generarCSV replaced by generarCSVEgresos and generarCSVIngresos

function descargarCSV(contenido, nombre) {
  const blob = new Blob(["\uFEFF" + contenido], {type:"text/tab-separated-values;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre; a.click();
  URL.revokeObjectURL(url);
}

function generarCSVEgresos(registros) {
    function sanCell(s) { return String(s||"").split("\n").join(" · ").split("\r").join("").split("\t").join(" ").trim(); }
  const header = ["Concepto","Valor","Fecha","Categoria","Cuenta","Nota"].join("\t");
  const rows = registros.map(r => {
    const valor = r.splitwise ? miParteSplit(r) : (r.monto||0);
    return [sanCell(r.descripcion), valor, fechaCorta(r.fecha), sanCell(r.categoria), sanCell(cuentaLabel(r)), sanCell(notaExport(r))].join("\t");
  });
  return header + "\n" + rows.join("\n");
}

function generarCSVIngresos(registros) {
    function sanCell(s) { return String(s||"").split("\n").join(" · ").split("\r").join("").split("\t").join(" ").trim(); }
  const header = ["Concepto","Valor","Fecha","Categoria","Cuenta"].join("\t");
  const rows = registros.map(r => [sanCell(r.descripcion), r.monto||0, fechaCorta(r.fecha), sanCell(r.categoria), sanCell(cuentaLabel(r))].join("\t"));
  return header + "\n" + rows.join("\n");
}

function ejecutarExport() {
  const mes = parseInt(document.getElementById("exp-mes").value);
  const anio = parseInt(document.getElementById("exp-anio").value);
  const mesStr = String(mes+1).padStart(2,"0");
  const anioStr = String(anio);
  const nomMes = MESES[mes]+anioStr.slice(2);
  const enMes = r => r.fecha && r.fecha.startsWith(anioStr+"-"+mesStr);
  const esPersonal = r => !r.esInterno && !r.release && r.tipo !== "movimiento";
  const egresos  = S.registros.filter(r => enMes(r) && esPersonal(r) && r.tipo === "gasto");
  const ingresos = S.registros.filter(r => enMes(r) && esPersonal(r) && r.tipo === "ingreso");
  const release  = S.registros.filter(r => enMes(r) && r.release === true);
  let n = 0;
  if (egresos.length)  { descargarCSV(generarCSVEgresos(egresos),   `${nomMes}_egresos.tsv`);  n++; }
  if (ingresos.length) { descargarCSV(generarCSVIngresos(ingresos), `${nomMes}_ingresos.tsv`); n++; }
  if (release.length)  { descargarCSV(generarCSVEgresos(release),   `${nomMes}_release.tsv`);  n++; }
  document.getElementById("export-modal").remove();
  if (!n) alert("No hay registros para ese mes y año.");
}

  if (moneda === "COP") {
    S.form.monto = raw;
    const pos = el.selectionStart, prevLen = el.value.length;
    el.value = Number(raw).toLocaleString("es-CO");
    try { el.setSelectionRange(pos + el.value.length - prevLen, pos + el.value.length - prevLen); } catch(e){}
  } else {
    // USD/EUR: auto insert 2 decimals — 20747 → 207.47
    const num = parseInt(raw, 10);

    S.form.monto = formatted;
    el.value = formatted;

  } catch(e) {
    alert("Error al actualizar: " + e.message);
    if (btn) { btn.innerText = "Guardar cambios"; btn.style.opacity = "1"; btn.disabled = false; }
  }
}

async function accionEliminar(id) {
  try {
    await dbEliminar(id);
    S.registros = S.registros.filter(r => r.id !== id);
    S.eliminarId = null;
    render();
  } catch(e) {
    alert("Error al eliminar: " + e.message);
  }
}

// ── Init ────────────────────────────────────────────────────────────────
const PWD = "164892";

function mostrarLogin() {
  document.getElementById("app").innerHTML = `
    <div style="min-height:100vh;background:#F7F6F3;display:flex;align-items:center;justify-content:center;padding:24px;">
      <div style="background:#fff;border-radius:16px;padding:32px 24px;width:100%;max-width:320px;border:1px solid #E8E6E1;">
        <p style="font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:#1a1a1a;margin-bottom:6px;">Finanzas</p>
        <p style="font-size:13px;color:#bbb;margin-bottom:24px;">Ingresa tu contraseña para continuar</p>
        <input id="inp-pwd" type="password" placeholder="Contraseña"
          style="width:100%;background:#F7F6F3;border:1.5px solid #E8E6E1;border-radius:10px;padding:12px 14px;font-size:15px;font-family:'Inter',sans-serif;outline:none;margin-bottom:12px;"
          onkeydown="if(event.key==='Enter') verificarPwd()" />
        <button onclick="verificarPwd()"
          style="width:100%;padding:13px;border-radius:10px;background:#1a1a1a;color:#fff;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;border:none;cursor:pointer;">
          Entrar
        </button>
        <p id="pwd-error" style="font-size:12px;color:#D94F3D;margin-top:10px;text-align:center;display:none;">Contraseña incorrecta</p>
      </div>
    </div>`;
  setTimeout(() => { const i = document.getElementById("inp-pwd"); if(i) i.focus(); }, 100);
}

function verificarPwd() {
  const val = document.getElementById("inp-pwd").value;
  if (val === PWD) {
    sessionStorage.setItem("auth", "1");
    iniciarApp();
  } else {
    const err = document.getElementById("pwd-error");
    if (err) err.style.display = "block";
    document.getElementById("inp-pwd").value = "";
  }
}

function iniciarApp() {
  document.getElementById("app").innerHTML = `
    <div style="min-height:100vh;background:#F7F6F3;display:flex;align-items:center;justify-content:center;">
      <p style="font-size:13px;color:#bbb;font-weight:500;letter-spacing:1px;">Cargando...</p>
    </div>`;
  Promise.all([dbCargar(), dbCargarRec()])
    .then(([regs, recs]) => { S.registros = regs || []; S.recordatorios = recs || []; render(); })
    .catch(e => {
      document.getElementById("app").innerHTML = `
        <div style="min-height:100vh;background:#F7F6F3;display:flex;align-items:center;justify-content:center;padding:24px;">
          <p style="font-size:13px;color:#D94F3D;text-align:center;">Error al conectar:<br>${e.message}</p>
        </div>`;
    });
}

if (sessionStorage.getItem("auth") === "1") {
  iniciarApp();
} else {
  mostrarLogin();
}

</script>
