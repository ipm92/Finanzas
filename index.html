function xhr(method, url, body) {
  return new Promise((resolve, reject) => {
    const r = new XMLHttpRequest();
    r.open(method, url, true);
    r.setRequestHeader("Content-Type", "application/json");
    r.setRequestHeader("apikey", SUPABASE_KEY);
    r.setRequestHeader("Authorization", "Bearer " + SUPABASE_KEY);
    r.setRequestHeader("Prefer", "return=representation");
    r.timeout = 12000;
    r.ontimeout = () => reject(new Error("Timeout - sin conexión"));
    r.onerror   = () => reject(new Error("Error de red"));
    r.onload    = () => {
      if (r.status >= 200 && r.status < 300) {
        try { resolve(JSON.parse(r.responseText)); } catch(e) { resolve([]); }
      } else {
        reject(new Error("Error " + r.status + ": " + r.responseText));
      }
    };
    r.send(body ? JSON.stringify(body) : null);
  });
}

function diasRestantes(fecha) {
  if (!fecha || fecha === 'null' || fecha === '') return null;
  const d = new Date(fecha);
  if (isNaN(d.getTime())) return null;
  const hoyMs = new Date().setHours(0,0,0,0);
  const fMs   = d.setHours(0,0,0,0);
  return Math.round((fMs - hoyMs) / 86400000);
}

}

function syncFormRec() {
  if (!S.formRec) return;
  const d=document.getElementById("fr-desc"), m=document.getElementById("fr-monto"), n=document.getElementById("fr-nota");
  if(d) S.formRec.descripcion=d.value;
  if(m) S.formRec.monto=m.value.replace(/\./g,"").replace(/\D/g,"");
  if(n) S.formRec.nota=n.value;
}
function formatMontoRec(el) {
  const raw=el.value.replace(/\D/g,"");
  S.formRec.monto=raw;
  el.value=raw?Number(raw).toLocaleString("es-CO"):"";
}
function accionCancelarRec() { S.formRec=null; S.editandoRecId=null; render(); }
function accionEditarRec(id) {
  const r=S.recordatorios.find(x=>x.id===id);
  if(!r) return;
  S.formRec={tipo:r.tipo,descripcion:r.descripcion||"",nota:r.nota||"",monto:String(r.monto||""),moneda:r.moneda||"COP",fecha_limite:r.fecha_limite||hoy(),pagado:r.pagado||false};
  S.editandoRecId=id;
  render();
}
async function accionMarcarPagado(id) {
  try {
    await dbActualizarRec(id, {pagado:true});
    S.recordatorios=S.recordatorios.map(r=>r.id===id?{...r,pagado:true}:r);
    render();
  } catch(e){ alert("Error: "+e.message); }
}
async function accionGuardarRec() {
  syncFormRec();
  const f=S.formRec;
  if(!f.descripcion||!f.monto){ alert("Completa descripción y monto"); return; }
  const obj={tipo:f.tipo,descripcion:f.descripcion,nota:f.nota,monto:parseFloat(f.monto),moneda:f.moneda,fecha_limite:f.fecha_limite,pagado:false};
  try {
    if(S.editandoRecId) {
      await dbActualizarRec(S.editandoRecId, obj);
      S.recordatorios=S.recordatorios.map(r=>r.id===S.editandoRecId?{...r,...obj}:r);
      S.editandoRecId=null;
    } else {
      const guardado=await dbGuardarRec(obj);
      if(guardado) S.recordatorios.push(guardado);
    }
    S.formRec=null;
    render();
  } catch(e){ alert("Error al guardar: "+e.message); }
}
async function accionReactivarRec(id) {
  try {
    await dbActualizarRec(id, {pagado: false});
    S.recordatorios = S.recordatorios.map(r => r.id===id ? {...r, pagado:false} : r);
    render();
  } catch(e) { alert("Error: " + e.message); }
}
async function accionEliminarRec(id) {
  try {
    await dbEliminarRec(id);
    S.recordatorios=S.recordatorios.filter(r=>r.id!==id);
    S.eliminarRecId=null;
    render();
  } catch(e){ alert("Error: "+e.message); }
}
async function cargarRec() {
  try { S.recordatorios=await dbCargarRec()||[]; render(); } catch(e){ S.recordatorios=[]; render(); }
}
async function accionToggleExcel(id) {
  const r = S.registros.find(x => x.id === id);
  if (!r) return;
  const nuevoValor = !r.enExcel;
  try {
    await xhr("PATCH", API + "?id=eq." + id + "&apikey=" + SUPABASE_KEY, { enExcel: nuevoValor });
    S.registros = S.registros.map(x => x.id === id ? {...x, enExcel: nuevoValor} : x);
    render();
  } catch(e) { alert("Error: " + e.message); }
}

function accionSetTab(t) { S.tab=t; S.form=formVacio(t); S.mostrarForm=false; render(); }

function accionToggleForm() {
  S.mostrarForm = !S.mostrarForm;
  if (S.mostrarForm) { S.form = formVacio(S.tab); S.editandoId = null; }
  render();
  if (S.mostrarForm) setTimeout(()=>{ const d=document.getElementById("f-desc"); if(d) d.focus(); }, 150);
}

function syncForm() {
  const fd = document.getElementById("f-desc");
  const fm = document.getElementById("f-monto");
  const fn = document.getElementById("f-nota");
  if (fd) S.form.descripcion = fd.value;
  if (fm) {
    if (S.form.moneda === "COP") {
      S.form.monto = fm.value.replace(/\./g,"").replace(/\D/g,"");
    } else {
      S.form.monto = fm.value; // already formatted as "207.47"
    }
  }
  if (fn) S.form.nota = fn.value;
}

function actualizarBtn() {
  const btn = document.getElementById("btn-guardar");
  if (!btn) return;
  const ok = S.form.descripcion && S.form.monto;
  btn.style.background = ok ? "#1a1a1a" : "#E8E6E1";
  btn.style.color = ok ? "#fff" : "#aaa";
}

function formatMonto(el) {
  const moneda = S.form.moneda;
  const raw = el.value.replace(/\D/g,"");
  if (!raw) { S.form.monto = ""; el.value = ""; actualizarBtn(); return; }
  if (moneda === "COP") {
    S.form.monto = raw;
    const pos = el.selectionStart, prevLen = el.value.length;
    el.value = Number(raw).toLocaleString("es-CO");
    try { el.setSelectionRange(pos + el.value.length - prevLen, pos + el.value.length - prevLen); } catch(e){}
  } else {
    // USD/EUR: auto insert 2 decimals — 20747 → 207.47
    const num = parseInt(raw, 10);
    const formatted = (num / 100).toFixed(2);
    S.form.monto = formatted;
    el.value = formatted;
  }
  actualizarBtn();
}

async function accionGuardar() {
  // Sync text fields directly from DOM
  const fd = document.getElementById("f-desc");
  const fm = document.getElementById("f-monto");
  const fn = document.getElementById("f-nota");
  if (fd) S.form.descripcion = fd.value.trim();
  if (fm) {
    if (S.form.moneda === "COP") {
      S.form.monto = fm.value.replace(/\./g,"").replace(/\D/g,"");
    } else {
      S.form.monto = fm.value; // already formatted as "207.47"
    }
  }
  if (fn) S.form.nota = fn.value.trim();

  if (!S.form.descripcion || !S.form.monto) {
    alert("Completa descripción y monto");
    return;
  }

  const btn = document.getElementById("btn-guardar");
  if (btn) { btn.innerText = "Guardando..."; btn.style.opacity = ".6"; btn.disabled = true; }

  const co = document.getElementById("f-cuentaOtro");
  if (co) S.form.cuentaOtro = co.value;

  const obj = {
    tipo:        S.form.tipo,
    descripcion: S.form.descripcion,
    nota:        S.form.nota,
    monto:       parseFloat(S.form.monto),
    cuenta:      S.form.cuenta,
    cuentaOtro:  S.form.cuentaOtro || "",
    fecha:       S.form.fecha,
    moneda:      S.form.moneda,
    splitwise:   S.form.splitwise,
    release:     S.form.release || false,
    enExcel:     S.form.enExcel || false,
  };

  try {
    const guardado = await dbGuardar(obj);
    if (guardado) S.registros.unshift(guardado);
    S.form = formVacio(S.tab);
    S.mostrarForm = false;
    render();
  } catch(e) {
    alert("Error al guardar: " + e.message);
    if (btn) { btn.innerText = "Guardar " + S.tab; btn.style.opacity = "1"; btn.disabled = false; }
  }
}

function accionEditar(id) {
  const r = S.registros.find(x => x.id === id);
  if (!r) return;
  S.form = {
    tipo:        r.tipo,
    descripcion: r.descripcion || "",
    nota:        r.nota || "",
    monto:       String(r.monto || ""),
    release:     r.release || false,
    cuentaOtro:  r.cuentaOtro || "",
    enExcel:     r.enExcel || false,
    cuenta:      r.cuenta || "davi-td",
    fecha:       r.fecha || hoy(),
    moneda:      r.moneda || "COP",
    splitwise:   r.splitwise || false,
  };
  S.tab = r.tipo;
  S.editandoId = id;
  S.mostrarForm = true;
  S.eliminarId = null;
  render();
  setTimeout(() => { const d = document.getElementById("f-desc"); if(d) d.focus(); }, 150);
}

  const fd = document.getElementById("f-desc");
  const fm = document.getElementById("f-monto");
  const fn = document.getElementById("f-nota");
  if (fd) S.form.descripcion = fd.value.trim();
  if (fm) {
    if (S.form.moneda === "COP") {
      S.form.monto = fm.value.replace(/\./g,"").replace(/\D/g,"");
    } else {
      S.form.monto = fm.value; // already formatted as "207.47"
    }
  }
  if (fn) S.form.nota = fn.value.trim();

  if (!S.form.descripcion || !S.form.monto) { alert("Completa descripción y monto"); return; }

  const btn = document.getElementById("btn-guardar");
  if (btn) { btn.innerText = "Guardando..."; btn.style.opacity = ".6"; btn.disabled = true; }

  const co = document.getElementById("f-cuentaOtro");
  if (co) S.form.cuentaOtro = co.value;

  const obj = {
    tipo:        S.form.tipo,
    descripcion: S.form.descripcion,
    nota:        S.form.nota,
    monto:       parseFloat(S.form.monto),
    cuenta:      S.form.cuenta,
    cuentaOtro:  S.form.cuentaOtro || "",
    fecha:       S.form.fecha,
    moneda:      S.form.moneda,
    splitwise:   S.form.splitwise,
    release:     S.form.release || false,
    enExcel:     S.form.enExcel || false,
  };

  try {
    const actualizado = await dbActualizar(S.editandoId, obj);
    S.registros = S.registros.map(r => r.id === S.editandoId ? {...r, ...obj} : r);
    S.editandoId = null;
    S.form = formVacio(S.tab);
    S.mostrarForm = false;
    render();
  } catch(e) {
    alert("Error al actualizar: " + e.message);
    if (btn) { btn.innerText = "Guardar cambios"; btn.style.opacity = "1"; btn.disabled = false; }
  }
}

async function accionEliminar(id) {
  try {
    await dbEliminar(id);
    S.registros = S.registros.filter(r => r.id !== id);
    S.eliminarId = null;
    render();
  } catch(e) {
    alert("Error al eliminar: " + e.message);
  }
}

function verificarPwd() {
  const val = document.getElementById("inp-pwd").value;
  if (val === PWD) {
    sessionStorage.setItem("auth", "1");
    iniciarApp();
  } else {
    const err = document.getElementById("pwd-error");
    if (err) err.style.display = "block";
    document.getElementById("inp-pwd").value = "";
  }
}

function iniciarApp() {
  document.getElementById("app").innerHTML = `
    <div style="min-height:100vh;background:#F7F6F3;display:flex;align-items:center;justify-content:center;">
      <p style="font-size:13px;color:#bbb;font-weight:500;letter-spacing:1px;">Cargando...</p>
    </div>`;
  Promise.all([dbCargar(), dbCargarRec()])
    .then(([regs, recs]) => { S.registros = regs || []; S.recordatorios = recs || []; render(); })
    .catch(e => {
      document.getElementById("app").innerHTML = `
        <div style="min-height:100vh;background:#F7F6F3;display:flex;align-items:center;justify-content:center;padding:24px;">
          <p style="font-size:13px;color:#D94F3D;text-align:center;">Error al conectar:<br>${e.message}</p>
        </div>`;
    });
}

if (sessionStorage.getItem("auth") === "1") {
  iniciarApp();
} else {
  mostrarLogin();
}

</script>
</body>
</html>
