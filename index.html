function xhr(method, url, body) {
  return new Promise((resolve, reject) => {
    const r = new XMLHttpRequest();
    r.open(method, url, true);
    r.setRequestHeader("Content-Type", "application/json");
    r.setRequestHeader("apikey", SUPABASE_KEY);
    r.setRequestHeader("Authorization", "Bearer " + SUPABASE_KEY);
    r.setRequestHeader("Prefer", "return=representation");
    r.timeout = 12000;
    r.ontimeout = () => reject(new Error("Timeout"));
    r.onerror   = () => reject(new Error("Error de red"));
    r.onload    = () => {
      if (r.status >= 200 && r.status < 300) {
        try { resolve(JSON.parse(r.responseText)); } catch(e) { resolve([]); }
      } else { reject(new Error("Error " + r.status + ": " + r.responseText)); }
    };
    r.send(body ? JSON.stringify(body) : null);
  });
}

async function dbCargar() {
  return await xhr("GET", API + "?order=fecha.desc,created_at.desc&apikey=" + SUPABASE_KEY);
}
async function dbGuardar(obj) {
  const res = await xhr("POST", API + "?apikey=" + SUPABASE_KEY, obj);
  return Array.isArray(res) ? res[0] : res;
}
async function dbActualizar(id, obj) {
  const res = await xhr("PATCH", API + "?id=eq." + id + "&apikey=" + SUPABASE_KEY, obj);
  return Array.isArray(res) ? res[0] : res;
}
async function dbEliminar(id) {
  await xhr("DELETE", API + "?id=eq." + id + "&apikey=" + SUPABASE_KEY);
}
async function dbCargarMeses() {
  return await xhr("GET", API_MES + "?apikey=" + SUPABASE_KEY);

async function dbArchivarMes(mes) {
  return await xhr("POST", API_MES + "?apikey=" + SUPABASE_KEY, { mes });
}
async function dbDesarchivarMes(mes) {
  await xhr("DELETE", API_MES + "?mes=eq." + encodeURIComponent(mes) + "&apikey=" + SUPABASE_KEY);
}

function hoy() { return new Date().toISOString().split("T")[0]; }
function getCuenta(id, tipo) { return (tipo==="gasto"?CUENTAS_GASTO:CUENTAS_INGRESO).find(c=>c.id===id)||{}; }
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function formatFecha(f) {
  if(!f) return "";
  const [y,m,d] = f.split("-");
  return parseInt(d)+" "+MESES_ES[parseInt(m)-1];
}
function mesKey(fecha) { return fecha ? fecha.slice(0,7) : ""; } // YYYY-MM
function mesLabel(key) {
  if(!key) return "";
  const [y,m] = key.split("-");
  return MESES_ES[parseInt(m)-1] + " " + y;
}

    </div>

    <!-- Descripción -->
    <div style="margin-bottom:14px;">
      <label style="${LBL}">Descripción</label>
      <input id="f-desc" type="text" value="${esc(form.descripcion)}" oninput="S.form.descripcion=this.value;actualizarBtn()"
        placeholder="Ej. Almuerzo" style="${INP}" />
    </div>

    <!-- Nota -->
    <div style="margin-bottom:14px;">
      <label style="${LBL}">Nota</label>
      <textarea id="f-nota" oninput="S.form.nota=this.value" placeholder="Contexto, detalles..."
        style="width:100%;background:#fff;border:1.5px solid #E8E6E1;border-radius:10px;padding:11px 14px;color:#1a1a1a;font-size:14px;resize:none;height:72px;outline:none;">${esc(form.nota)}</textarea>
    </div>

    <!-- Monto + Moneda + Fecha -->
    <div style="display:flex;gap:10px;margin-bottom:14px;">
      <div style="flex:2;">
        <label style="${LBL}">Monto</label>
        <input id="f-monto" type="text" inputmode="numeric" value="${form.monto?Number(String(form.monto).replace(/\./g,"")).toLocaleString("es-CO"):""}"
          oninput="formatMonto(this)" placeholder="0" style="${INP}" />
      </div>
      <div style="flex:1;">
        <label style="${LBL}">Moneda</label>
        <select id="f-moneda" onchange="S.form.moneda=this.value"
          style="${INP}padding:11px 8px;background:#fff;">
          ${MONEDAS.map(m=>`<option value="${m}" ${form.moneda===m?"selected":""}>${m}</option>`).join("")}
        </select>
      </div>
      <div style="flex:1.5;">
        <label style="${LBL}">Fecha</label>
        <input type="date" value="${form.fecha}" onchange="S.form.fecha=this.value"
          style="${INP}color-scheme:light;" />
      </div>
    </div>

    <!-- Cuenta -->
    <div style="margin-bottom:14px;">
      <label style="${LBL}">${form.tipo==="gasto"?"Medio de pago":form.tipo==="movimiento"?"Cuenta origen":"Cuenta que recibe"}</label>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${cuentas.map(c=>`
          <button onclick="syncForm();S.form.cuenta='${c.id}';render()" style="padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;text-align:left;background:${form.cuenta===c.id?c.color+"14":"#F7F6F3"};color:${form.cuenta===c.id?c.color:"#555"};border:1.5px solid ${form.cuenta===c.id?c.color+"55":"#E8E6E1"};">
            ${c.label}
          </button>`).join("")}
      </div>
      ${form.cuenta==="otro"?`
      <input id="f-cuenta-otro" type="text" value="${esc(form.cuentaOtro)}" oninput="S.form.cuentaOtro=this.value"
        placeholder="¿Cuál cuenta?" style="${INP}margin-top:8px;" />`:""}
    </div>

    <!-- Categoría con búsqueda -->
    <div style="margin-bottom:14px;position:relative;">
      <label style="${LBL}">Categoría</label>
      <input id="f-cat" type="text" value="${esc(form.categoria)}"
        oninput="S.catBusqueda=this.value;S.form.categoria=this.value;renderCatDropdown()"
        onfocus="S.catBusqueda=this.value;renderCatDropdown()"
        placeholder="Buscar categoría..."
        autocomplete="off"
        style="${INP}" />
      <div id="cat-dd" style="display:none;position:absolute;z-index:100;background:#fff;border:1.5px solid #E8E6E1;border-radius:10px;max-height:180px;overflow-y:auto;width:100%;box-shadow:0 4px 12px rgba(0,0,0,.08);"></div>
    </div>

    <!-- Splitwise toggle -->
    <div onclick="syncForm();S.form.splitwise=!S.form.splitwise;render()" style="display:flex;align-items:center;gap:12px;cursor:pointer;padding:11px 14px;border-radius:10px;margin-bottom:${form.splitwise?"8px":"10px"};background:${form.splitwise?"#FFF8E8":"#F7F6F3"};border:1.5px solid ${form.splitwise?"#E8C84A":"#E8E6E1"};">
      <div style="width:36px;height:20px;border-radius:10px;flex-shrink:0;background:${form.splitwise?"#E8C84A":"#D8D5CE"};position:relative;">
        <div style="width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:3px;left:${form.splitwise?19:3}px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);"></div>
      </div>
      <p style="font-size:13px;font-weight:500;color:${form.splitwise?"#A0862A":"#888"};">Poner en Splitwise</p>
    </div>

    ${form.splitwise?`
    <div style="background:#FFFBEF;border:1.5px solid #E8C84A44;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:10px;">
      <div style="flex:1;">
        <label style="${LBL}">Regla</label>
        <input id="f-sw-regla" type="text" value="${esc(form.splitwiseRegla)}" oninput="S.form.splitwiseRegla=this.value"
          placeholder="50/50, ÷4, custom..." style="${INP}font-size:13px;" />
      </div>
      <div style="flex:1;">
        <label style="${LBL}">Con quién</label>
        <input id="f-sw-quien" type="text" value="${esc(form.splitwiseConQuien)}" oninput="S.form.splitwiseConQuien=this.value"
          placeholder="Arturo, Familia..." style="${INP}font-size:13px;" />
      </div>
    </div>`:""}

    <!-- Release -->
    <div onclick="syncForm();S.form.release=!S.form.release;render()" style="display:flex;align-items:center;gap:12px;cursor:pointer;padding:11px 14px;border-radius:10px;margin-bottom:10px;background:${form.release?"#FFF3E0":"#F7F6F3"};border:1.5px solid ${form.release?"#E8760A55":"#E8E6E1"};">
      <div style="width:36px;height:20px;border-radius:10px;flex-shrink:0;background:${form.release?"#E8760A":"#D8D5CE"};position:relative;">
        <div style="width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:3px;left:${form.release?19:3}px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);"></div>
      </div>
      <p style="font-size:13px;font-weight:500;color:${form.release?"#E8760A":"#888"};">Release</p>
    </div>

    <!-- Interno + Apto -->
    <div onclick="syncForm();S.form.esInterno=!S.form.esInterno;render()" style="display:flex;align-items:center;gap:12px;cursor:pointer;padding:11px 14px;border-radius:10px;margin-bottom:10px;background:${form.esInterno?"#E3F2FD":"#F7F6F3"};border:1.5px solid ${form.esInterno?"#90CAF9":"#E8E6E1"};">
      <div style="width:36px;height:20px;border-radius:10px;flex-shrink:0;background:${form.esInterno?"#64B5F6":"#D8D5CE"};position:relative;">
        <div style="width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:3px;left:${form.esInterno?19:3}px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);"></div>
      </div>
      <p style="font-size:13px;font-weight:500;color:${form.esInterno?"#1565C0":"#888"};">Mvto. Interno (pago TC, traslado)</p>
    </div>

    <div onclick="syncForm();S.form.esProyectoApto=!S.form.esProyectoApto;render()" style="display:flex;align-items:center;gap:12px;cursor:pointer;padding:11px 14px;border-radius:10px;margin-bottom:16px;background:${form.esProyectoApto?"#F3E5F5":"#F7F6F3"};border:1.5px solid ${form.esProyectoApto?"#CE93D8":"#E8E6E1"};">
      <div style="width:36px;height:20px;border-radius:10px;flex-shrink:0;background:${form.esProyectoApto?"#BA68C8":"#D8D5CE"};position:relative;">
        <div style="width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:3px;left:${form.esProyectoApto?19:3}px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);"></div>
      </div>
      <p style="font-size:13px;font-weight:500;color:${form.esProyectoApto?"#6A1B9A":"#888"};">Proyecto Apartamento</p>
    </div>

    <button id="btn-guardar" onclick="${S.editandoId?"accionActualizar":"accionGuardar"}()" style="width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:600;background:${form.descripcion&&form.monto?"#1a1a1a":"#E8E6E1"};color:${form.descripcion&&form.monto?"#fff":"#aaa"};">
      ${S.editandoId?"Guardar cambios":"Guardar "+form.tipo}
    </button>
  </div>`;
}

// ── Helpers ─────────────────────────────────────────────────────────────
function syncForm() {
  const fd=document.getElementById("f-desc"), fm=document.getElementById("f-monto"),
        fn=document.getElementById("f-nota"), fc=document.getElementById("f-cat"),
        fco=document.getElementById("f-cuenta-otro"),
        fsr=document.getElementById("f-sw-regla"), fsq=document.getElementById("f-sw-quien");
  if(fd) S.form.descripcion=fd.value;
  if(fm) S.form.monto=fm.value.replace(/\./g,"").replace(/\D/g,"");
  if(fn) S.form.nota=fn.value;
  if(fc) S.form.categoria=fc.value;
  if(fco) S.form.cuentaOtro=fco.value;
  if(fsr) S.form.splitwiseRegla=fsr.value;
  if(fsq) S.form.splitwiseConQuien=fsq.value;
}

function formatMonto(el) {
  const raw=el.value.replace(/\D/g,"");
  S.form.monto=raw;
  el.value=raw?Number(raw).toLocaleString("es-CO"):"";
  actualizarBtn();
}

function actualizarBtn() {
  const btn=document.getElementById("btn-guardar"); if(!btn) return;
  const ok=S.form.descripcion&&S.form.monto;
  btn.style.background=ok?"#1a1a1a":"#E8E6E1";
  btn.style.color=ok?"#fff":"#aaa";
}

function renderCatDropdown() {
  const dd=document.getElementById("cat-dd"); if(!dd) return;
  const cats = S.tab==="ingreso" ? CATS_INGRESO : CATS_GASTO;
  const q=S.catBusqueda||"";
  const filtradas=cats.filter(c=>!q||c.toLowerCase().includes(q.toLowerCase()));
  if(!filtradas.length){dd.style.display="none";return;}
  dd.style.display="block";
  dd.innerHTML=filtradas.map(c=>`<div onclick="selCat('${c.replace(/'/g,"\\'")}'); " style="padding:10px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid #F0EDE8;" onmouseover="this.style.background='#F7F6F3'" onmouseout="this.style.background=''">${c}</div>`).join("");
}
function selCat(cat) {
  S.form.categoria=cat; S.catBusqueda=cat;
  const i=document.getElementById("f-cat"); if(i) i.value=cat;
  const dd=document.getElementById("cat-dd"); if(dd) dd.style.display="none";
}
document.addEventListener("click", e=>{ if(!e.target.closest("#cat-dd")&&e.target.id!=="f-cat"){const dd=document.getElementById("cat-dd");if(dd)dd.style.display="none";}});

function toggleMes(k) {
  if(S.mesesColapsados.has(k)) S.mesesColapsados.delete(k);
  else S.mesesColapsados.add(k);
  render();
}

// ── Acciones ─────────────────────────────────────────────────────────────
function accionSetTab(t) { S.tab=t; S.form=formVacio(t); S.mostrarForm=false; render(); }

function accionToggleForm() {
  S.mostrarForm=!S.mostrarForm;
  if(S.mostrarForm) { S.form=formVacio(S.tab); S.editandoId=null; }
  render();
  if(S.mostrarForm) setTimeout(()=>{const d=document.getElementById("f-desc");if(d)d.focus();},150);
}

async function accionGuardar() {
  syncForm();
  const f=S.form;
  if(!f.descripcion||!f.monto){alert("Completa descripción y monto");return;}
  const btn=document.getElementById("btn-guardar");
  if(btn){btn.innerText="Guardando...";btn.style.opacity=".6";btn.disabled=true;}
  const obj = {
    tipo:f.tipo, descripcion:f.descripcion, nota:f.nota,
    monto:parseFloat(f.monto), cuenta:f.cuenta, cuentaOtro:f.cuentaOtro||"",
    fecha:f.fecha, moneda:f.moneda, categoria:f.categoria||"",
    release:f.release||false, esInterno:f.esInterno||false,
    esProyectoApto:f.esProyectoApto||false,
    splitwise:f.splitwise||false,
    splitwiseRegla:f.splitwiseRegla||"", splitwiseConQuien:f.splitwiseConQuien||"",
    enExcel:false,
  };
  try {
    const guardado=await dbGuardar(obj);
    if(guardado) S.registros.unshift(guardado);
    S.form=formVacio(S.tab); S.mostrarForm=false; render();
  } catch(e) {
    alert("Error: "+e.message);
    if(btn){btn.innerText="Guardar "+S.tab;btn.style.opacity="1";btn.disabled=false;}
  }
}

function accionEditar(id) {
  const r=S.registros.find(x=>x.id===id); if(!r) return;
  S.form={
    tipo:r.tipo, descripcion:r.descripcion||"", nota:r.nota||"",
    monto:String(r.monto||""), cuenta:r.cuenta||"davi-td", cuentaOtro:r.cuentaOtro||"",
    fecha:r.fecha||hoy(), moneda:r.moneda||"COP", categoria:r.categoria||"",
    release:r.release||false, esInterno:r.esInterno||false,
    esProyectoApto:r.esProyectoApto||false,
    splitwise:r.splitwise||false,
    splitwiseRegla:r.splitwiseRegla||"", splitwiseConQuien:r.splitwiseConQuien||"",
  };
  S.tab=r.tipo; S.editandoId=id; S.mostrarForm=true; S.eliminarId=null;
  render();
  setTimeout(()=>{const d=document.getElementById("f-desc");if(d)d.focus();},150);
}

async function accionActualizar() {
  syncForm();
  const f=S.form;
  if(!f.descripcion||!f.monto){alert("Completa descripción y monto");return;}
  const btn=document.getElementById("btn-guardar");
  if(btn){btn.innerText="Guardando...";btn.style.opacity=".6";btn.disabled=true;}
  const obj = {
    tipo:f.tipo, descripcion:f.descripcion, nota:f.nota,
    monto:parseFloat(f.monto), cuenta:f.cuenta, cuentaOtro:f.cuentaOtro||"",
    fecha:f.fecha, moneda:f.moneda, categoria:f.categoria||"",
    release:f.release||false, esInterno:f.esInterno||false,
    esProyectoApto:f.esProyectoApto||false,
    splitwise:f.splitwise||false,
    splitwiseRegla:f.splitwiseRegla||"", splitwiseConQuien:f.splitwiseConQuien||"",
  };
  try {
    await dbActualizar(S.editandoId, obj);
    S.registros=S.registros.map(r=>r.id===S.editandoId?{...r,...obj}:r);
    S.editandoId=null; S.form=formVacio(S.tab); S.mostrarForm=false; render();
  } catch(e) {
    alert("Error: "+e.message);
    if(btn){btn.innerText="Guardar cambios";btn.style.opacity="1";btn.disabled=false;}
  }
}

async function accionEliminar(id) {
  try {
    await dbEliminar(id);
    S.registros=S.registros.filter(r=>r.id!==id);
    S.eliminarId=null; render();
  } catch(e){alert("Error: "+e.message);}
}

async function accionToggleSplitwise(id) {
  const r=S.registros.find(x=>x.id===id); if(!r) return;
  const v=!r.splitwiseDone;
  try {
    await dbActualizar(id,{splitwiseDone:v});
    S.registros=S.registros.map(x=>x.id===id?{...x,splitwiseDone:v}:x);
    render();
  } catch(e){alert("Error: "+e.message);}
}

async function accionToggleExcel(id) {
  const r=S.registros.find(x=>x.id===id); if(!r) return;
  const v=!r.enExcel;
  try {
    await dbActualizar(id,{enExcel:v});
    S.registros=S.registros.map(x=>x.id===id?{...x,enExcel:v}:x);
    render();
  } catch(e){alert("Error: "+e.message);}
}

async function accionArchivarMes(k) {
  try {
    if(S.mesesArchivados.has(k)) {
      await dbDesarchivarMes(k);
      S.mesesArchivados.delete(k);
      S.mesesColapsados.delete(k);
    } else {
      await dbArchivarMes(k);
      S.mesesArchivados.add(k);
      S.mesesColapsados.add(k);
    }
    render();
  } catch(e){alert("Error: "+e.message);}
}

// ── Init ──────────────────────────────────────────────────────────────────
if(sessionStorage.getItem("auth")==="1") iniciarApp();
else mostrarLogin();
</script>
</body>
</html>
